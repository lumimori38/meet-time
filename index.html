async function fireStore(cfg){

  if(mr) mr.onclick = () => {
    const ln = arr => arr.map(g => '<button class="rg" data-d="' + g.d + '" data-r="' + g.r0 + '">' + rtext(A, g) + '</button>').join('');
    openSheet('<h3 class="h">되는 시간 모아 보기</h3>' + (S.sumAll.length ? '<div class="grp"><b>★ 모두 가능한 시간</b><div class="rl">' + ln(S.sumAll) + '</div></div>' : '') + (S.sumMost.length ? '<div class="grp"><b>' + (S.sumAll.length ? '그다음으로 많이 되는 시간' : '가장 많이 되는 시간') + '</b><div class="rl">' + ln(S.sumMost) + '</div></div>' : '') + '<button class="btn sec" id="c0">닫기</button>');
    sh('#c0').onclick = closeSheet;
    document.querySelectorAll('.sh .rg').forEach(b => b.onclick = () => { closeSheet(); jumpTo(+b.dataset.d, +b.dataset.r); });
  };
  const s2 = app.querySelector('#sh2'); if(s2) s2.onclick = () => openShare(false);
  const cr = app.querySelector('#cr'); if(cr) cr.onclick = () => copy(resultText(A), cr, '결과가 복사됐어요!');
}
function jumpTo(d, r){
  const { per } = pages(S.ev.meta.dates.length);
  const p = Math.floor(d / per);
  if(p !== S.page){ S.page = p; drawGrid(analyze()); }
  const R = rowsOf(S.ev.meta), c = app.querySelector('.c[data-i="' + (d * R + r) + '"]'), gb = app.querySelector('.gb');
  if(!c || !gb) return;
  gb.scrollTo({ top: Math.max(0, c.offsetTop - 40), behavior: 'smooth' });
  c.classList.remove('fl'); void c.offsetWidth; c.classList.add('fl');
}
function refresh(){
  const A = analyze();
  const ta = app.querySelector('#ta'); if(ta) ta.textContent = '모두의 결과 · ' + A.N + '명';
  if(S.tab === 'all'){
    const gb = app.querySelector('.gb'), y = gb ? gb.scrollTop : 0;
    renderEvent();
    const g2 = app.querySelector('.gb'); if(g2) g2.scrollTop = y;
  }
}

function drawGrid(A){
  const gd = app.querySelector('#gd'), m = A.m, R = A.R, D = A.D, heat = S.tab === 'all';
  const { p, per } = pages(D);
  if(S.page >= p) S.page = 0;
  const d0 = S.page * per, d1 = Math.min(D, d0 + per), n = d1 - d0;
  const rh = m.step === 30 ? 26 : 38;
  let h = '';
  if(p > 1) h += '<div class="pg"><button class="ib" id="pp" aria-label="이전 날짜"' + (S.page ? '' : ' disabled') + '>' + ico.back + '</button><span>' + esc(fdate(m.dates[d0])) + ' – ' + esc(fdate(m.dates[d1 - 1])) + ' <em>' + (S.page + 1) + '/' + p + '</em></span><button class="ib" id="pn" aria-label="다음 날짜"' + (S.page < p - 1 ? '' : ' disabled') + '>' + ico.next + '</button></div>';
  h += '<div class="gh" style="--n:' + n + '"><div></div>';
  for(let d = d0; d < d1; d++){ const dt = pdate(m.dates[d]), w = dt.getDay(); h += '<div class="dh' + (w === 0 ? ' su' : w === 6 ? ' sa' : '') + '"><b>' + (dt.getMonth() + 1) + '/' + dt.getDate() + '</b><span>' + WD[w] + '</span></div>'; }
  h += '</div><div class="gb"><div class="gr' + (heat ? ' heat' : '') + '" style="--n:' + n + ';--rh:' + rh + 'px">';
  for(let r = 0; r < R; r++){
    const hr = (m.start * 60 + r * m.step) % 60 === 0;
    h += '<div class="t">' + (hr ? '<span>' + ftime(m, r) + '</span>' : '') + '</div>';
    for(let d = d0; d < d1; d++){
      const i = d * R + r;
      if(heat){
        const c = A.cnt[i], all = A.N && c === A.N;
        h += '<div class="c' + (hr ? ' hr' : '') + (all ? ' all' : '') + '" data-i="' + i + '"' + (c && !all ? ' style="background:rgba(var(--rgb),' + (0.14 + 0.66 * c / A.N).toFixed(2) + ')"' : '') + '></div>';
      }else h += '<div class="c' + (hr ? ' hr' : '') + (S.mine[i] ? ' on' : '') + '" data-i="' + i + '"></div>';
    }
  }
  h += '</div><div class="gr" style="--n:' + n + ';--rh:18px"><div class="t"><span>' + ftime(m, R) + '</span></div></div><div class="gend"></div><div class="cta"><b>다른 모임 시간도 정해 볼까요?</b><div class="row2"><button class="btn sm" id="cn">새 약속 만들기</button><button class="btn sm sec" id="ct">언제 볼까? 공유</button></div></div>' + (heat ? footer(true) : '<div style="height:20px"></div>') + '</div>';
  gd.innerHTML = h;
  const pp = gd.querySelector('#pp'), pn = gd.querySelector('#pn');
  if(pp) pp.onclick = () => { S.page--; drawGrid(analyze()); };
  if(pn) pn.onclick = () => { S.page++; drawGrid(analyze()); };
  gd.querySelector('#cn').onclick = () => go('new');
  gd.querySelector('#ct').onclick = shareTool;
  G = { body: gd.querySelector('.gb'), heat, R };
  bindGrid(G.body);
}

let G = null, P = null, T = null, M = null, raf = 0, lastPt = null;
const cellAt = (x, y) => {
  if(!G) return null;
  const b = G.body.getBoundingClientRect();
  x = Math.min(Math.max(x, b.left + 46), b.right - 10);
  y = Math.min(Math.max(y, b.top + 2), b.bottom - 2);
  const el = document.elementFromPoint(x, y);
  return el && el.closest ? el.closest('.gb .c') : null;
};
function bindGrid(body){
  body.addEventListener('contextmenu', e => e.preventDefault());
  body.addEventListener('touchstart', e => {
    if(e.touches.length > 1){ if(P) endPaint(); T = null; return; }
    const p = e.touches[0], c = p.target.closest ? p.target.closest('.c') : null;
    T = { x: p.clientX, y: p.clientY, c, moved: false, timer: 0 };
    if(c && !G.heat) T.timer = setTimeout(() => {
      if(!T || T.moved) return;
      if(!S.name){ T = null; askName(); return; }
      if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
      lastPt = { x: T.x, y: T.y };
      startPaint(T.c); T.paint = true;
    }, 400);
  }, { passive: true });
  body.addEventListener('touchmove', e => {
    if(!T) return;
    const p = e.touches[0];
    if(T.paint){ e.preventDefault(); lastPt = { x: p.clientX, y: p.clientY }; movePaint(cellAt(p.clientX, p.clientY)); return; }
    if(Math.abs(p.clientX - T.x) > 8 || Math.abs(p.clientY - T.y) > 8){ T.moved = true; clearTimeout(T.timer); }
  }, { passive: false });
  body.addEventListener('touchend', e => {
    if(!T) return;
    clearTimeout(T.timer);
    if(T.paint){ e.preventDefault(); endPaint(); }
    else if(!T.moved && T.c){ e.preventDefault(); tap(T.c); }
    T = null;
  });
  body.addEventListener('touchcancel', () => { if(T) clearTimeout(T.timer); if(P) endPaint(); T = null; });
  body.addEventListener('mousedown', e => {
    if(e.button !== 0) return;
    const c = e.target.closest('.c'); if(!c) return;
    e.preventDefault();
    if(G.heat){ M = c; return; }
    if(!S.name){ askName(); return; }
    lastPt = { x: e.clientX, y: e.clientY };
    startPaint(c);
  });
}
addEventListener('mousemove', e => { if(P && !T){ lastPt = { x: e.clientX, y: e.clientY }; movePaint(cellAt(e.clientX, e.clientY)); } });
addEventListener('mouseup', e => {
  if(P && !T) endPaint();
  if(M){ const c = e.target.closest && e.target.closest('.c'); if(c === M) tap(c); M = null; }
});
function tap(c){
  const i = +c.dataset.i;
  if(G.heat){ showCell(i); return; }
  if(!S.name){ askName(); return; }
  S.mine[i] = S.mine[i] ? 0 : 1;
  c.classList.toggle('on', !!S.mine[i]);
  queueSave(400);
}
function startPaint(c){
  const i = +c.dataset.i;
  P = { i0: i, cur: -1, val: S.mine[i] ? 0 : 1, snap: S.mine.slice() };
  movePaint(c);
  cancelAnimationFrame(raf); raf = requestAnimationFrame(auto);
}
function movePaint(c){
  if(!P || !c) return;
  const i = +c.dataset.i; if(i === P.cur) return;
  P.cur = i;
  const R = G.R, da = Math.floor(P.i0 / R), ra = P.i0 % R, db = Math.floor(i / R), rb = i % R;
  const [dl, dh] = da < db ? [da, db] : [db, da], [rl, rhh] = ra < rb ? [ra, rb] : [rb, ra];
  G.body.querySelectorAll('.c').forEach(el => {
    const k = +el.dataset.i, d = Math.floor(k / R), r = k % R;
    const v = d >= dl && d <= dh && r >= rl && r <= rhh ? P.val : P.snap[k];
    if(S.mine[k] !== v){ S.mine[k] = v; el.classList.toggle('on', !!v); }
  });
}
function auto(){
  if(!P) return;
  if(lastPt && G){
    const b = G.body.getBoundingClientRect();
    const dy = lastPt.y < b.top + 36 ? -7 : lastPt.y > b.bottom - 36 ? 7 : 0;
    if(dy){ G.body.scrollTop += dy; movePaint(cellAt(lastPt.x, lastPt.y)); }
  }
  raf = requestAnimationFrame(auto);
}
function endPaint(){ P = null; cancelAnimationFrame(raf); queueSave(0); refreshTabCount(); }
function refreshTabCount(){ const ta = app.querySelector('#ta'); if(ta) ta.textContent = '모두의 결과 · ' + analyze().N + '명'; }

let saveT = 0;
function queueSave(ms){
  clearTimeout(saveT);
  const st = app.querySelector('#stt'); if(st) st.textContent = '저장 중…';
  saveT = setTimeout(async () => {
    try{
      await S.store.saveRes(S.id, { n: S.name, s: S.mine.join('') });
      const st2 = app.querySelector('#stt'); if(st2) st2.textContent = S.demo ? '예시라 저장 안 돼요' : '저장됐어요';
    }catch(e){ const st2 = app.querySelector('#stt'); if(st2) st2.textContent = '저장 못 했어요. 다시 칠해 주세요'; }
  }, ms);
}

let sheetAt = 0;
const sh = s => document.querySelector('.sh ' + s);
function openSheet(html){
  closeSheet();
  const dim = document.createElement('div'); dim.className = 'dim';
  const box = document.createElement('div'); box.className = 'sh'; box.innerHTML = html;
  document.body.append(dim, box);
  sheetAt = Date.now();
  dim.onclick = () => { if(Date.now() - sheetAt > 450) closeSheet(); };
}
function closeSheet(){
  document.querySelectorAll('.dim,.sh').forEach(e => e.remove());
  app.querySelectorAll('.c.pick').forEach(e => e.classList.remove('pick'));
}
function askName(){
  openSheet('<h3 class="h">이름을 알려 주세요</h3><p>친구들이 알아볼 수 있는 이름이면 돼요</p><input class="fld" id="yn" maxlength="12" placeholder="예: 루미" value="' + esc(S.name) + '" enterkeyhint="done"><button class="btn" id="ok">' + (S.name ? '바꾸기' : '시작하기') + '</button>');
  const inp = sh('#yn'), ok = sh('#ok');
  const done = () => {
    const v = inp.value.trim(); if(!v){ inp.focus(); return; }
    S.name = v; if(!S.demo) LS.set('em-name', v);
    closeSheet();
    const nb = app.querySelector('#nmb'); if(nb) nb.innerHTML = '<b>' + esc(v) + '</b> 님이 되는 시간' + ico.pen;
    if(S.ev && S.ev.res && S.ev.res[S.store.uid]) queueSave(0);
  };
  ok.onclick = done;
  inp.onkeydown = e => { if(e.key === 'Enter') done(); };
  setTimeout(() => inp.focus(), 250);
}
function shareLink(){ return location.href.split('#')[0] + '#' + (S.demo ? 'demo-' : '') + 'e-' + S.id; }
function openShare(fresh){
  openSheet('<h3 class="h">' + (fresh ? '약속을 만들었어요!' : '친구들에게 링크를 보내요') + '</h3><p>링크를 연 사람이 되는 시간을 칠하면<br>모두 되는 시간이 바로 보여요</p><div class="link" id="lk">' + esc(shareLink()) + '</div><button class="btn" id="cp">링크 복사</button>' + (fresh ? '<button class="btn sec" id="c0">내 시간 칠하러 가기</button>' : '<button class="btn sec" id="c0">닫기</button>'));
  sh('#cp').onclick = e => copy(shareLink(), e.currentTarget);
  sh('#c0').onclick = () => { closeSheet(); if(S.tab !== 'mine') go('e-' + S.id); else if(fresh && !S.name) setTimeout(askName, 50); };
}
function showCell(i){
  const A = analyze(), m = A.m, R = A.R, d = Math.floor(i / R), r = i % R;
  const yes = A.people.filter(p => p.s[i] === '1'), no = A.people.filter(p => p.s[i] !== '1');
  const chip = (p, k) => '<span class="chip ' + k + '">' + esc(p.n) + (p.u === S.store.uid ? ' (나)' : '') + '</span>';
  openSheet('<h3 class="h">' + esc(fdate(m.dates[d])) + ' ' + ftime(m, r) + '–' + ftime(m, r + 1) + '</h3>'
    + (A.N && yes.length === A.N ? '<span class="badge">★ 모두 가능해요</span>' : '<p>' + (A.N ? A.N + '명 중 ' + yes.length + '명이 돼요' : '아직 응답한 사람이 없어요') + '</p>')
    + '<div class="grp"><b>가능 ' + yes.length + '명</b><div class="chips">' + (yes.length ? yes.map(p => chip(p, 'yes')).join('') : '<span class="none">아무도 없어요</span>') + '</div></div>'
    + '<div class="grp"><b>안 돼요 ' + no.length + '명</b><div class="chips">' + (no.length ? no.map(p => chip(p, 'nope')).join('') : '<span class="none">없어요</span>') + '</div></div>'
    + '<button class="btn sec" id="c0">닫기</button>');
  sh('#c0').onclick = closeSheet;
  const c = app.querySelector('.c[data-i="' + i + '"]'); if(c) c.classList.add('pick');
}

const TAGS = '#루미오락실 #언제볼까 #약속';
const toolUrl = () => location.href.split('#')[0];
function resultText(A){
  const all = ranges(A, A.N);
  let top = 0; for(const v of A.cnt) if(v < A.N && v > top) top = v;
  const most = top ? ranges(A, top) : [];
  const ln = g => '· ' + fdate(A.m.dates[g.d]) + ' ' + ftime(A.m, g.r0) + '–' + ftime(A.m, g.r1);
  const blocks = ['[' + NAME + '] ' + A.m.name];
  blocks.push(all.length ? ['★ 모두 가능한 시간 (' + A.N + '/' + A.N + '명)', ...all.map(ln)].join('\n') : '모두 되는 시간은 아직 없어요');
  if(most.length) blocks.push([(all.length ? '그다음으로 많이 되는 시간' : '가장 많이 되는 시간') + ' (' + top + '/' + A.N + '명)', ...most.slice(0, 5).map(ln), ...(most.length > 5 ? ['· 외 ' + (most.length - 5) + '개'] : [])].join('\n'));
  blocks.push('응답 ' + A.N + '명: ' + A.people.map(p => p.n).join(', '));
  blocks.push(TAGS + '\n' + shareLink());
  return blocks.join('\n\n');
}
function shareTool(){
  const url = toolUrl();
  const tw = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent('[' + NAME + '] 링크 하나로 모두 되는 시간 찾기\n' + TAGS + '\n' + url);
  openSheet('<h3 class="h">' + NAME + ' 공유하기</h3><p>모임 시간 정할 일이 있는 친구에게<br>알려 주세요</p><div class="link">' + esc(url) + '</div><div class="row2"><button class="btn" id="cp">링크 복사하기</button><a class="btn sec" id="tw" href="' + esc(tw) + '" target="_blank" rel="noopener">트위터 공유하기</a></div><button class="btn ln" id="c0" style="margin-top:8px">닫기</button>');
  sh('#cp').onclick = e => copy(url, e.currentTarget);
  sh('#c0').onclick = closeSheet;
}

async function copy(text, btn, msg){
  let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; }catch(e){}
  if(!ok){ const t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;top:0;opacity:0'; document.body.append(t); t.select(); t.setSelectionRange(0, text.length); try{ ok = document.execCommand('copy'); }catch(e){} t.remove(); }
  const old = btn.dataset.l || btn.textContent; btn.dataset.l = old;
  btn.textContent = ok ? '복사 완료!' : '복사가 안 됐어요';
  if(ok) bubble(btn, msg || '링크가 복사됐어요!');
  setTimeout(() => { btn.textContent = old; }, 1500);
}
function bubble(el, text){
  document.querySelectorAll('.bub').forEach(b => b.remove());
  const r = el.getBoundingClientRect(), b = document.createElement('div');
  b.className = 'bub'; b.textContent = text; document.body.append(b);
  const above = r.top > 50;
  b.classList.add(above ? 'a' : 'b');
  const half = b.offsetWidth / 2, x = Math.min(Math.max(r.left + r.width / 2, half + 8), innerWidth - half - 8);
  b.style.left = x + 'px';
  b.style.top = (above ? r.top - b.offsetHeight - 8 : r.bottom + 8) + 'px';
  setTimeout(() => b.remove(), 2000);
}

function openMenu(){
  closeMenu();
  const items = [['home','홈'],['new','약속 만들기'],['mine','내 시간 선택'],['all','모두의 결과'],['cell','칸 상세'],['share','공유 시트']];
  const d = document.createElement('div'); d.className = 'fdim';
  const m = document.createElement('div'); m.className = 'fmenu';
  m.innerHTML = items.map(([k, t]) => '<button data-k="' + k + '">' + t + '</button>').join('');
  document.body.append(d, m);
  d.onclick = closeMenu;
  m.onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    const k = b.dataset.k; closeMenu();
    if(!S.store.db.sample) S.store = demoStore();
    if(k === 'home') return go('');
    if(k === 'new') return go('new');
    if(k === 'mine') return go('e-sample');
    if(k === 'all') return go('e-sample-all');
    if(k === 'cell'){
      const tmp = S.store.db.sample, R = rowsOf(tmp.meta), n = R * 7;
      const ss = Object.values(tmp.res).map(x => x.s);
      let i = 0; for(; i < n; i++) if(ss.every(s => s[i] === '1')) break;
      S.pendingCell = i + 2;
      if(S.id === 'sample' && S.tab === 'all' && S.ev){ S.pendingCell = null; return showCell(i + 2); }
      return go('e-sample-all');
    }
    if(k === 'share'){
      if(S.id === 'sample' && S.ev && location.hash.includes('e-sample')) return openShare(false);
      S.pendingShare = true; return go('e-sample');
    }
  };
}
function closeMenu(){ document.querySelectorAll('.fdim,.fmenu').forEach(e => e.remove()); }

(async () => {
  try{ S.live = FIREBASE_CONFIG ? await Promise.race([fireStore(FIREBASE_CONFIG), new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 12000))]) : localStore(); }
  catch(e){
    app.innerHTML = '<div class="scr"><div class="load"><div><b>연결하지 못했어요</b><br>인터넷 연결을 확인하고<br>다시 시도해 주세요<br><br><button class="btn sm" id="rt" style="width:180px">다시 시도</button></div></div>' + footer(false) + '</div>';
    app.querySelector('#rt').onclick = () => location.reload();
    return;
  }
  S.store = S.live;
  addEventListener('hashchange', route);
  route();
})();
}
</script>
